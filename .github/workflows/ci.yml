name: CI

on:
  pull_request:
  push:
    branches: [main, master, switch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify LinuxServer container contract
        run: .github/scripts/verify-container-contract.sh

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Test server
        run: npm test

      - name: Test and typecheck client
        run: npm test --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix client --omit=dev --audit-level=high

      - name: Build container
        run: docker build --file .docker/Dockerfile --tag flameswitch:ci .

      - name: Verify container startup
        run: |
          container_id=$(docker run --detach \
            --env PASSWORD=ci-test \
            --env PUID=1000 \
            --env PGID=1000 \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:5005:5005 \
            flameswitch:ci)
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5005/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
