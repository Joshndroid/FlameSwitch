name: Build and Push to GHCR

on:
  push:
    tags:
      - 'switch-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/switch-}
          else
            VERSION="dev"
          fi
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" package.json

      - name: Generate changelog
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/switch-}
            PREV_TAG=$(git tag --sort=-version:refname | grep '^switch-' | sed -n '2p')

            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
            fi

            DATE=$(date +%Y-%m-%d)
            NEW_ENTRY="### v${VERSION} (${DATE})\n${COMMITS}\n"

            if [ -f CHANGELOG.md ]; then
              echo -e "${NEW_ENTRY}\n$(cat CHANGELOG.md)" > CHANGELOG.md
            else
              echo -e "${NEW_ENTRY}" > CHANGELOG.md
            fi
          else
            echo "Skipping changelog generation for manual dispatch"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/joshndroid/flame-switch:latest
            ghcr.io/joshndroid/flame-switch:${{ github.ref_name }}
