services:
  flame:
    image: ghcr.io/joshndroid/flame-switch:latest
    container_name: flame
    volumes:
      - /path/to/host/data:/app/data
      # - /path/to/favicon.ico:/app/public/icons/favicon.ico  #  optional change to your own favicon.co
      # - /var/log/flame-dash:/app/log  #  optional external access.log remote logging or fail2ban
      # - /var/run/docker.sock:/var/run/docker.sock # optional but required for Docker integration
    ports:
      - 5005:5005
    # secrets:
    #   - password # optional but required for (1)
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Australia/Brisbane}
      - PASSWORD=${PASSWORD:?Set PASSWORD before starting FlameSwitch}
      # - TRUST_PROXY=true # one reverse proxy; use 2 for two trusted proxy hops
      # - PASSWORD_FILE=/run/secrets/password # optional but required for (1)
      # - WEATHER_CACHE_HOURS=6  #  optional to cut down calls to weather api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

# optional but required for Docker secrets (1)
# secrets:
#   password:
#     file: /path/to/secrets/password

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5005/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
